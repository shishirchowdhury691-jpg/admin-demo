<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Admin Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#15202b;--mute:#5d6b7a;--line:#d8dee5;--brand:#2f5bea;--accent:#e8913a;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f151c;--panel:#18212b;--ink:#e8edf2;--mute:#94a3b3;--line:#2a3643}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f151c;--panel:#18212b;--ink:#e8edf2;--mute:#94a3b3;--line:#2a3643}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px}
nav h1{font-size:16px;margin:0 8px 18px;font-weight:600}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mute);padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--brand);color:var(--onbrand)}
nav button:hover:not(.on){background:var(--bg)}
main{padding:24px;max-width:960px;width:100%;overflow-x:hidden}
h2{margin:0 0 4px;font-size:22px;font-weight:600}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=range]{padding:0;accent-color:var(--brand)}
input[type=color]{padding:2px;height:36px;width:56px}
button.b{background:var(--brand);color:var(--onbrand);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
button.g{background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.d{color:#c0392b}
button:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
.prev{height:190px;border-radius:8px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:16px;transition:background .5s}
.prev h3{margin:0;font-size:24px}
.prev .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
.prev .arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}
.tag{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mute)}
.slide{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:8px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.brandbar{background:var(--brand);color:var(--onbrand);padding:10px 14px;border-radius:6px;display:flex;justify-content:space-between}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav h1{display:none}nav button{width:auto;white-space:nowrap}.slide{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
var S={site:{name:"DemoCorp",brand:"#2f5bea",accent:"#e8913a"},
auto:true,
slides:[{t:"Welcome to DemoCorp",type:"Image",d:5,c:"#2f5bea"},{t:"Our latest film",type:"Video",d:8,c:"#7a3fb5"},{t:"New product line",type:"Image",d:4,c:"#1f8a70"}],
projects:[{n:"Harbor Tower",cat:"Architecture",y:2024,s:"Published"},{n:"Aria Chair",cat:"Product",y:2023,s:"Published"},{n:"Nova Lamp",cat:"Product",y:2025,s:"Draft"},{n:"City Library",cat:"Architecture",y:2022,s:"Published"}],
team:[{n:"Anna Berg",r:"Founder"},{n:"Luca Rossi",r:"Lead Designer"},{n:"Mia Chen",r:"Marketing"}],
news:[{t:"We opened a new studio",d:"2026-11-10"},{t:"Award for Aria Chair",d:"2026-10-02"}]};
var tab="Carousel",sort={k:"n",dir:1},filt="All",cur=0,timer=null,t0=0;
var TABS=["Carousel","Projects","Team","News","Site settings"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1600)}
function applyTheme(){var r=document.documentElement.style;r.setProperty("--brand",S.site.brand);r.setProperty("--accent",S.site.accent)}
function nav(){$("nav").innerHTML="<h1>"+esc(S.site.name)+" admin</h1>"+TABS.map(function(t){return '<button class="'+(t==tab?"on":"")+'" data-t="'+t+'">'+t+"</button>"}).join("");
[].forEach.call($("nav").querySelectorAll("button"),function(b){b.onclick=function(){tab=b.dataset.t;render()}})}
function head(t,s){return "<h2>"+t+'</h2><p class="sub">'+s+"</p>"}
function render(){stop();nav();var m=$("main");
if(tab=="Carousel")carousel(m);else if(tab=="Projects")projects(m);else if(tab=="Team")team(m);else if(tab=="News")news(m);else settings(m)}
/* Carousel */
function carousel(m){
m.innerHTML=head("Homepage carousel","Set how long each slide shows, reorder slides, or switch to manual navigation.")+
'<div class="card"><div class="prev" id="pv"><h3 id="pt"></h3><button class="arr" id="pl" style="left:10px" aria-label="Previous">&#8249;</button><button class="arr" id="pr" style="right:10px" aria-label="Next">&#8250;</button><div class="bar" id="pb"></div></div>'+
'<div class="row" style="margin-top:12px"><label class="row"><input type="checkbox" id="au" '+(S.auto?"checked":"")+'> Advance automatically</label><span class="sub" style="margin:0">'+(S.auto?"Each slide uses its own timing.":"Visitors use the arrows.")+"</span></div></div>"+
'<div class="card"><div id="sl"></div><div class="row" style="margin-top:12px"><input id="nt" placeholder="New slide title"><select id="ny"><option>Image</option><option>Video</option></select><button class="b" id="ad">Add slide</button></div></div>';
$("au").onchange=function(){S.auto=this.checked;toast("Saved");render()};
$("ad").onclick=function(){var v=$("nt").value.trim();if(!v){toast("Enter a title first");return}S.slides.push({t:v,type:$("ny").value,d:5,c:["#2f5bea","#7a3fb5","#1f8a70","#c2410c"][S.slides.length%4]});toast("Slide added");render()};
$("pl").onclick=function(){go(cur-1)};$("pr").onclick=function(){go(cur+1)};
$("sl").innerHTML=S.slides.map(function(s,i){return '<div class="slide"><div><strong>'+esc(s.t)+'</strong> <span class="tag">'+s.type+'</span></div><label class="row"><input type="range" min="2" max="15" value="'+s.d+'" data-i="'+i+'"><span id="dv'+i+'">'+s.d+'s</span></label><div class="row"><button class="g" data-u="'+i+'" aria-label="Move up">&#8593;</button><button class="g" data-w="'+i+'" aria-label="Move down">&#8595;</button><button class="g d" data-x="'+i+'">Delete</button></div></div>'}).join("");
[].forEach.call($("sl").querySelectorAll("input[type=range]"),function(r){r.oninput=function(){S.slides[r.dataset.i].d=+r.value;$("dv"+r.dataset.i).textContent=r.value+"s"};r.onchange=function(){toast("Saved")}});
[].forEach.call($("sl").querySelectorAll("button"),function(b){b.onclick=function(){var a=S.slides,i;
if(b.dataset.x!==undefined){a.splice(+b.dataset.x,1)}
else if(b.dataset.u!==undefined){i=+b.dataset.u;if(i>0){var x=a[i];a[i]=a[i-1];a[i-1]=x}}
else{i=+b.dataset.w;if(i<a.length-1){var y=a[i];a[i]=a[i+1];a[i+1]=y}}
cur=0;render()}});
go(0)}
function go(i){var n=S.slides.length;if(!n){$("pt").textContent="No slides yet";return}cur=(i+n)%n;var s=S.slides[cur];
$("pv").style.background="linear-gradient(135deg,"+s.c+",#15202b)";$("pt").textContent=s.t+(s.type=="Video"?"  \u25B6":"");
clearInterval(timer);var b=$("pb");b.style.width="0";if(!S.auto)return;t0=Date.now();
timer=setInterval(function(){if(!$("pb")){clearInterval(timer);return}var p=(Date.now()-t0)/(s.d*1000);$("pb").style.width=Math.min(p*100,100)+"%";if(p>=1)go(cur+1)},100)}
function stop(){clearInterval(timer)}
/* Projects */
function projects(m){
var cats=["All"].concat(S.projects.map(function(p){return p.cat}).filter(function(v,i,a){return a.indexOf(v)==i}));
var rows=S.projects.filter(function(p){return filt=="All"||p.cat==filt}).sort(function(a,b){var x=a[sort.k],y=b[sort.k];return (x>y?1:x<y?-1:0)*sort.dir});
var H=[["n","Name"],["cat","Category"],["y","Year"],["s","Status"]];
m.innerHTML=head("Projects","Click a column to sort. Visitors get the same sorting and filtering on the public page.")+
'<div class="card"><div class="row" style="margin-bottom:12px"><label class="row">Filter <select id="fc">'+cats.map(function(c){return "<option"+(c==filt?" selected":"")+">"+c+"</option>"}).join("")+"</select></label></div>"+
'<div class="tbl"><table><thead><tr>'+H.map(function(h){return '<th data-k="'+h[0]+'">'+h[1]+(sort.k==h[0]?(sort.dir>0?" \u25B2":" \u25BC"):"")+"</th>"}).join("")+"<th></th></tr></thead><tbody>"+
rows.map(function(p){var i=S.projects.indexOf(p);return "<tr><td>"+esc(p.n)+"</td><td>"+esc(p.cat)+"</td><td>"+p.y+'</td><td><button class="g" data-s="'+i+'">'+p.s+'</button></td><td><button class="g d" data-x="'+i+'">Delete</button></td></tr>'}).join("")+"</tbody></table></div></div>"+
'<div class="card"><div class="row"><input id="pn" placeholder="Project name"><input id="pc" placeholder="Category"><input id="py" type="number" placeholder="Year" style="width:90px"><button class="b" id="pa">Add project</button></div></div>';
$("fc").onchange=function(){filt=this.value;render()};
[].forEach.call(m.querySelectorAll("th[data-k]"),function(h){h.onclick=function(){if(sort.k==h.dataset.k)sort.dir*=-1;else{sort.k=h.dataset.k;sort.dir=1}render()}});
[].forEach.call(m.querySelectorAll("button[data-s]"),function(b){b.onclick=function(){var p=S.projects[b.dataset.s];p.s=p.s=="Draft"?"Published":"Draft";toast(p.s);render()}});
[].forEach.call(m.querySelectorAll("button[data-x]"),function(b){b.onclick=function(){S.projects.splice(b.dataset.x,1);toast("Deleted");render()}});
$("pa").onclick=function(){var n=$("pn").value.trim(),c=$("pc").value.trim();if(!n||!c){toast("Name and category are required");return}S.projects.push({n:n,cat:c,y:+$("py").value||2026,s:"Draft"});toast("Project added");render()}}
/* Team */
function team(m){
m.innerHTML=head("Team","Shown on the About us page.")+'<div class="grid">'+S.team.map(function(p,i){return '<div class="card" style="margin:0"><div class="av">'+esc(p.n.split(" ").map(function(w){return w[0]}).join(""))+"</div><strong>"+esc(p.n)+'</strong><div class="sub" style="margin:0 0 8px">'+esc(p.r)+'</div><button class="g d" data-x="'+i+'">Remove</button></div>'}).join("")+"</div>"+
'<div class="card" style="margin-top:16px"><div class="row"><input id="tn" placeholder="Full name"><input id="tr" placeholder="Role"><button class="b" id="ta">Add member</button></div></div>';
[].forEach.call(m.querySelectorAll("button[data-x]"),function(b){b.onclick=function(){S.team.splice(b.dataset.x,1);toast("Removed");render()}});
$("ta").onclick=function(){var n=$("tn").value.trim();if(!n){toast("Enter a name first");return}S.team.push({n:n,r:$("tr").value.trim()||"Team member"});toast("Member added");render()}}
/* News */
function news(m){
m.innerHTML=head("News","Newest first on the public site.")+'<div class="card">'+(S.news.length?S.news.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(n){var i=S.news.indexOf(n);return '<div class="slide" style="grid-template-columns:1fr auto"><div><strong>'+esc(n.t)+'</strong><div class="sub" style="margin:0">'+n.d+'</div></div><button class="g d" data-x="'+i+'">Delete</button></div>'}).join(""):'<p class="sub">No news yet. Add your first post below.</p>')+"</div>"+
'<div class="card"><div class="row"><input id="nh" placeholder="Headline" style="flex:1"><input id="nd" type="date" value="2026-11-17"><button class="b" id="na">Publish</button></div></div>';
[].forEach.call(m.querySelectorAll("button[data-x]"),function(b){b.onclick=function(){S.news.splice(b.dataset.x,1);toast("Deleted");render()}});
$("na").onclick=function(){var h=$("nh").value.trim();if(!h){toast("Enter a headline first");return}S.news.push({t:h,d:$("nd").value});toast("Published");render()}}
/* Settings */
function settings(m){
m.innerHTML=head("Site settings","Change the name and colors. The preview updates instantly.")+
'<div class="card"><div class="row"><label class="row">Site name <input id="sn" value="'+esc(S.site.name)+'"></label><label class="row">Main color <input type="color" id="sb" value="'+S.site.brand+'"></label><label class="row">Accent color <input type="color" id="sa" value="'+S.site.accent+'"></label></div></div>'+
'<div class="card"><div class="brandbar"><strong id="bn">'+esc(S.site.name)+'</strong><span>Home &nbsp; Projects &nbsp; About &nbsp; News</span></div><p><span class="tag" style="border-color:var(--accent);color:var(--accent)">Accent preview</span></p></div>';
$("sn").oninput=function(){S.site.name=this.value;$("bn").textContent=this.value;nav()};
$("sb").oninput=function(){S.site.brand=this.value;applyTheme()};
$("sa").oninput=function(){S.site.accent=this.value;applyTheme()}}
applyTheme();render();
</script>
</body>
</html>
